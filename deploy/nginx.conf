# Nginx site config for StockFlow.
# Install to /etc/nginx/sites-available/stockflow and symlink into sites-enabled.
# Nginx serves the built React app and reverse-proxies the API, admin, and
# Django static files to Gunicorn on 127.0.0.1:8000.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Built React SPA (output of `npm run build`, copied to /var/www/stockflow).
    root /var/www/stockflow;
    index index.html;

    # API, interactive docs (/api/docs, /api/redoc, /api/schema) and auth.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin.
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin CSS/JS), served by WhiteNoise via Gunicorn.
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Everything else is the SPA; fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
